# Judgement signals: status is green | amber | red. Refresh weekly (they go STALE after max_age_days).
judgements:
  bank_disclosures:
    status: green
    as_of: 2026-11-23
    note: "23 Nov: two new EDGAR hits since 21 Nov, neither tied to NBFI/private-credit lending. MS Q3 10-Q ('charge-off'): Q3 net charge-offs $106m driven by corporate loans (incl. loans moved to held-for-sale and sold) and CRE; Secured Lending Facilities NCO ratio 0% on $75bn average loans; ACL growth from corporate/secured-lending growth and specific CRE/corporate provisions (https://www.sec.gov/Archives/edgar/data/895421/000089542126000293/ms-20260930.htm). ZION Q3 10-Q CFO certification exhibit is boilerplate 'fraud' wording (https://www.sec.gov/Archives/edgar/data/109380/000010938026000127/exh312certofcfo10-q20260930.htm). The 20 Nov review stands: WFC fund-finance demand, no losses; ZION NDFI loans $2.2bn, nonaccrual 0.4%, 9M NDFI NCOs 0%; MTB NDFI table, no losses; C/BAC/KEY reserve builds not attributed to NBFI/private credit. https://www.sec.gov/Archives/edgar/data/72971/000007297126000327/wfc-20260930.htm https://www.sec.gov/Archives/edgar/data/109380/000010938026000127/zions-20260930.htm https://www.sec.gov/Archives/edgar/data/36270/000003627026000060/mtb-20260930.htm https://www.sec.gov/Archives/edgar/data/831001/000083100126000056/c-20260930.htm https://www.sec.gov/Archives/edgar/data/70858/000007085826000548/bac-20260930.htm https://www.sec.gov/Archives/edgar/data/91576/000009157626000023/key-20260930.htm"
  insurer_ratings:
    status: amber
    as_of: 2026-11-23
    note: "1 downgrade in 16-23 Nov 2026: AM Best downgraded CICA Life Insurance Company of America (US life insurer) FSR to B+ from B++ and Long-Term ICR to bbb- from bbb+ on 20 Nov 2026, citing weak risk-adjusted capitalisation and declining statutory capital (https://www.financialcontent.com/article/bizwire-2026-11-20-am-best-downgrades-credit-ratings-of-cica-life-insurance-company-of-america ; https://insurancenewsnet.com/oarticle/am-best-downgrades-credit-ratings-of-cica-life-insurance-company-of-america). Not counted: AM Best outlook revision to negative on Dynamic Reinsurance LLC (reinsurer, outlook only, listed on https://web.ambest.com/ratings-services/industry-centers/life-annuity-insurance-information). No Moody's/S&P/Fitch downgrades or negative outlooks found for Athene, Corebridge, F&G, Brighthouse, Jackson, Lincoln, Global Atlantic or Security Benefit (web searches 23 Nov). Already recorded earlier: A-CAP Group cut to C- (12 Nov), Baltimore Life outlook negative (6 Nov); Brighthouse still under review with negative implications at AM Best."

