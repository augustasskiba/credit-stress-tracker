# Judgement signals: status is green | amber | red. Refresh weekly (they go STALE after max_age_days).
judgements:
  bank_disclosures:
    status: green
    as_of: 2026-11-20
    note: "Q3 10-Qs read (keyword sections): WFC loan growth incl. 'fund finance' demand, no losses; ZION NDFI loans $2.2bn (4% of loans), nonaccrual 0.4%, 9M NDFI NCOs 0%, ACL/NDFI 1.31%; MTB NDFI table (PE funds $3.3bn outstanding), no losses cited; C reserve build $369m from macro outlook/growth, BAC qualitative build for Middle East conflict, KEY build on economic conditions; none tied to NBFI/private credit. https://www.sec.gov/Archives/edgar/data/72971/000007297126000327/wfc-20260930.htm https://www.sec.gov/Archives/edgar/data/109380/000010938026000127/zions-20260930.htm https://www.sec.gov/Archives/edgar/data/36270/000003627026000060/mtb-20260930.htm https://www.sec.gov/Archives/edgar/data/831001/000083100126000056/c-20260930.htm https://www.sec.gov/Archives/edgar/data/70858/000007085826000548/bac-20260930.htm https://www.sec.gov/Archives/edgar/data/91576/000009157626000023/key-20260930.htm"
  insurer_ratings:
    status: amber
    as_of: 2026-11-20
    note: "1 downgrade: AM Best cut A-CAP Group insurers Atlantic Coast Life and Sentinel Security Life FSR to C- (Weak) from C+ and ICR to ccc- from b-, still under review with negative implications; release published 12 Nov 2026 (https://insurancenewsnet.com/innarticle/am-best-downgrades-ratings-of-a-cap-group-insurers). It is one day outside the 7-day window but was not dated in any earlier weekly review, so it is counted here. It follows the 22 Sep 2026 cut to C+ (https://insurancenewsnet.com/innarticle/am-best-downgrades-a-cap-insurers-amid-financial-and-regulatory-troubles). No Moody's/S&P/Fitch downgrades or negative outlooks on other US life/annuity insurers found for 13-20 Nov 2026."

